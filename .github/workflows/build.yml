name: Build & Release J.A.R.V.I.S.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: rm -rf android && flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --no-tree-shake-icons
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/*.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter config --enable-linux-desktop
      - run: rm -rf linux && flutter create --platforms=linux .
      - run: flutter pub get
      - run: flutter build linux --release --no-tree-shake-icons
      - name: Upload Linux App
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: build/linux/x64/release/bundle/

  create-release:
    needs: [build-android, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create ZIP packages
        run: |
          cd artifacts
          zip -r JARVIS-Android-APKs.zip android-apks/ || true
          zip -r JARVIS-Linux.zip linux-app/ || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "J.A.R.V.I.S. 2.0 – Venom Edition Official Release"
          body: |
            ## 🚀 J.A.R.V.I.S. 2.0 – Venom Edition

            ### ✨ Features
            - 🎙️ **Voice Interaction**: Speech-to-Text + TTS integration
            - 🧠 **Multi-AI Engine**: Google Gemini, OpenAI GPT-4, Anthropic Claude
            - 📱 **Device Controls**: Android intents, SMS, app launching
            - 🏠 **IoT / Smart Home**: MQTT client integration
            - 🔍 **Live Search & Research**: Brave Search, NewsAPI, Shodan
            - 🎨 **3D Holographic UI**: Animated cyber-orb with glowing plasma core
            - 💾 **Encrypted Vault**: Secure local storage for API keys and memory

            ### 📦 Download Packages:
            - **📱 Android APKs**: `JARVIS-Android-APKs.zip` (split-per-abi arm64, armeabi-v7a, x86_64)
            - **🐧 Linux App**: `JARVIS-Linux.zip`

            ### 👨‍💻 Created & Masterminded by Tehzeeb
          draft: false
          prerelease: false
          files: |
            artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
